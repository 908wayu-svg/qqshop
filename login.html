<body class="auth-page">

<header>
  <a class="brand" href="index.html">QQSHOP</a>
  <button class="btn-lang" onclick="toggleLang()"><span data-lang-label>EN</span></button>
</header>

<main class="auth-main">
  <div class="auth-card">
    <div class="tabs">
      <button id="tab-login" class="tab active" onclick="showTab('login')" data-i18n="login_title">เข้าสู่ระบบ</button>
      <button id="tab-register" class="tab" onclick="showTab('register')" data-i18n="register_title">สมัครสมาชิก</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- เข้าสู่ระบบ -->
    <form id="form-login" onsubmit="return doLogin(event)">
      <label for="login-email" data-i18n="email">อีเมล</label>
      <input type="email" id="login-email" required autocomplete="email">
      <label for="login-password" data-i18n="password">รหัสผ่าน</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="submit" class="btn-primary" data-i18n="login_btn">เข้าสู่ระบบ</button>
      <button type="button" class="btn-link" onclick="doReset()" data-i18n="forgot_password">ลืมรหัสผ่าน?</button>
    </form>

    <!-- สมัครสมาชิก -->
    <form id="form-register" class="hidden" onsubmit="return doRegister(event)">
      <label for="reg-name" data-i18n="name">ชื่อ</label>
      <input type="text" id="reg-name" required autocomplete="name">
      <label for="reg-email" data-i18n="email">อีเมล</label>
      <input type="email" id="reg-email" required autocomplete="email">
      <label for="reg-phone" data-i18n="phone">เบอร์โทร</label>
      <input type="tel" id="reg-phone" autocomplete="tel">
      <label for="reg-password" data-i18n="password">รหัสผ่าน</label>
      <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn-primary" data-i18n="register_btn">สมัครสมาชิก</button>
    </form>

    <div class="divider"><span data-i18n="or">หรือ</span></div>

    <button class="btn-social btn-google" onclick="doGoogle()">
      <span class="ico">G</span><span data-i18n="continue_google">เข้าสู่ระบบด้วย Google</span>
    </button>
    <!-- ปุ่มเข้าสู่ระบบด้วย Facebook ถอดออกไปก่อน — แอปสร้างแล้วที่ developers.facebook.com
         (App ID 1721138543349738) แต่ต้องผ่าน Business Verification ของ Meta ก่อนถึงจะเปิดให้
         ลูกค้าทั่วไปใช้ได้ (ตอนนี้ใช้ได้เฉพาะเจ้าของแอป) ระหว่างรอ ไม่โชว์ปุ่มนี้ให้ลูกค้าเห็น
         โค้ด doFacebook()/loginWithFacebook() ยังอยู่ครบ พร้อมเปิดใช้ทันทีที่ผ่านการตรวจสอบ -->

    <a class="btn-link center" href="index.html" data-i18n="browse_shop">ดูสินค้าก่อน</a>
  </div>
</main>

<script src="i18n.js"></script>
<script src="ui.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="contact.js"></script>
<script>
function showTab(which) {
  document.getElementById("form-login").classList.toggle("hidden", which !== "login");
  document.getElementById("form-register").classList.toggle("hidden", which !== "register");
  document.getElementById("tab-login").classList.toggle("active", which === "login");
  document.getElementById("tab-register").classList.toggle("active", which === "register");
  setMsg("");
}

function setMsg(text, kind = "error") {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg" + (text ? " show " + kind : "");
}

// หน้าที่ยอมให้เด้งต่อหลังล็อกอินสำเร็จ (เฉพาะหน้าในเว็บเราเท่านั้น)
// ห้ามเอาค่าจาก ?next= ไปใช้ตรงๆ เด็ดขาด ไม่งั้นคนร้ายส่งลิงก์
// login.html?next=https://เว็บปลอม ให้ลูกค้า พอล็อกอินเสร็จจะถูกพาไปเว็บปลอม
// ที่ทำหน้าตาเหมือนของเรา แล้วหลอกเอารหัสผ่านซ้ำได้
const NEXT_ALLOWED = ["index.html", "wallet.html", "purchases.html", "admin.html"];

function afterLogin() {
  const next = new URLSearchParams(location.search).get("next");
  location.href = NEXT_ALLOWED.includes(next) ? next : "index.html";
}

// กันกดปุ่มรัวจนสมัคร/ล็อกอินซ้อนกัน
let busy = false;
async function guard(fn) {
  if (busy) return;
  if (!window.QQ?.isConfigured) {
    setMsg(getLang() === "th"
      ? "ยังไม่ได้ตั้งค่า Firebase (แก้ที่ไฟล์ firebase-config.js)"
      : "Firebase is not configured yet (edit firebase-config.js)");
    return;
  }
  busy = true;
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await fn(); }
  catch (e) { setMsg(QQ.friendlyError(e)); }
  finally {
    busy = false;
    document.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

function doLogin(e) {
  e.preventDefault();
  guard(async () => {
    await QQ.loginWithEmail(
      document.getElementById("login-email").value.trim(),
      document.getElementById("login-password").value
    );
    afterLogin();
  });
  return false;
}

function doRegister(e) {
  e.preventDefault();
  const pw = document.getElementById("reg-password").value;
  if (pw.length < 6) { setMsg(t("pw_too_short")); return false; }
  guard(async () => {
    await QQ.registerWithEmail(
      document.getElementById("reg-email").value.trim(), pw,
      document.getElementById("reg-name").value.trim(),
      document.getElementById("reg-phone").value.trim()
    );
    afterLogin();
  });
  return false;
}

function doGoogle() { guard(async () => { await QQ.loginWithGoogle(); afterLogin(); }); }
function doFacebook() { guard(async () => { await QQ.loginWithFacebook(); afterLogin(); }); }

function doReset() {
  const email = document.getElementById("login-email").value.trim();
  if (!email) { setMsg(t("enter_email_first")); return; }
  guard(async () => { await QQ.resetPassword(email); setMsg(t("reset_sent"), "ok"); });
}
</script>
</body>
