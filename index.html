<body>

<header>
  <a class="brand" href="index.html">QQSHOP</a>
  <div class="header-actions">
    <button class="btn-lang" onclick="toggleLang()"><span data-lang-label>EN</span></button>
    <a class="credit-chip hidden" id="nav-credit" href="wallet.html">
      <span class="credit-label" data-i18n="credit">เครดิต</span>
      <b id="nav-credit-amount">฿0</b>
    </a>
    <a class="btn-ghost hidden" id="nav-purchases" href="purchases.html" data-i18n="purchases">ประวัติการซื้อ</a>
    <a class="btn-ghost hidden" id="nav-admin" href="admin.html" data-i18n="admin_panel">หลังบ้าน</a>
    <a class="btn-ghost" id="nav-login" href="login.html" data-i18n="login">เข้าสู่ระบบ</a>
    <button class="btn-ghost hidden" id="nav-logout" onclick="QQ.logout()" data-i18n="logout">ออกจากระบบ</button>
    <button id="cart-btn" onclick="openCart()">🛒 <span data-i18n="cart">ตะกร้า</span> (<span id="cart-count">0</span>)</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <h1 data-i18n="hero_title">ร้านไอดีเกม QQSHOP</h1>
      <p data-i18n="hero_sub">ไอดีเกมของแท้ ราคาถูก จ่ายด้วยเครดิต ได้ของทันทีหลังแอดมินอนุมัติ</p>
      <div class="hero-badges">
        <span data-i18n="hero_b1">⚡ ได้ของไว</span>
        <span data-i18n="hero_b2">🔒 ปลอดภัย</span>
        <span data-i18n="hero_b3">💬 แอดมินตอบตลอด</span>
      </div>
    </div>
  </section>
  <nav class="cat-tabs" id="cat-tabs" aria-label="หมวดหมู่สินค้า"></nav>

  <div class="shop-tools">
    <div class="search-box">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <input type="text" class="search" id="q" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="search_products" placeholder="ค้นหาชื่อสินค้า...">
      <button type="button" class="search-x hidden" id="q-clear" data-i18n-title="clear_search" title="ล้างคำค้น">×</button>
    </div>
    <div class="filter-row">
      <div class="price-range">
        <span class="fl" data-i18n="price_range">ช่วงราคา</span>
        <input type="number" id="pmin" min="0" step="1" inputmode="numeric"
               data-i18n-placeholder="price_min" placeholder="ต่ำสุด">
        <span class="dash" aria-hidden="true">–</span>
        <input type="number" id="pmax" min="0" step="1" inputmode="numeric"
               data-i18n-placeholder="price_max" placeholder="สูงสุด">
      </div>
      <select id="sort" data-i18n-title="sort_by" title="เรียงลำดับ">
        <option value="default" data-i18n="sort_default">เรียง: ร้านจัดให้</option>
        <option value="price_asc" data-i18n="sort_price_asc">ราคา: ถูก → แพง</option>
        <option value="price_desc" data-i18n="sort_price_desc">ราคา: แพง → ถูก</option>
        <option value="name" data-i18n="sort_name">ชื่อ: ก → ฮ</option>
      </select>
      <button type="button" class="btn-ghost hidden" id="clear-filters" data-i18n="clear_filters">ล้างตัวกรอง</button>
    </div>
    <div class="result-count" id="result-count"></div>
  </div>

  <div class="grid" id="grid"><div class="empty" data-i18n="loading">กำลังโหลด...</div></div>
</main>

<!-- ตะกร้า -->
<div class="overlay" id="cart-overlay">
  <div class="panel">
    <button class="btn-close" onclick="closePanel('cart-overlay')">×</button>
    <h2 data-i18n="cart_title">ตะกร้าสินค้า</h2>
    <div id="cart-list"></div>
    <div class="cart-total">
      <span data-i18n="total">รวมทั้งหมด</span>
      <span id="cart-total-amount">฿0</span>
    </div>
    <div class="credit-row" id="cart-credit-row">
      <span data-i18n="my_credit">เครดิตของฉัน</span>
      <span id="cart-credit">฿0</span>
    </div>
    <div id="cart-msg" class="msg"></div>
    <button class="btn-primary" id="cart-checkout" onclick="doCheckout()" data-i18n="checkout">สั่งซื้อ</button>
    <a class="btn-link center" href="wallet.html" data-i18n="topup_now">เติมเงิน</a>
  </div>
</div>

</body>
