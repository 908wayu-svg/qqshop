<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQSHOP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">QQSHOP</a>
  <div class="header-actions">
    <button class="btn-lang" onclick="toggleLang()"><span data-lang-label>EN</span></button>
    <a class="btn-ghost hidden" id="nav-admin" href="admin.html" data-i18n="admin_panel">หลังบ้าน</a>
    <a class="btn-ghost" id="nav-login" href="login.html" data-i18n="login">เข้าสู่ระบบ</a>
    <button class="btn-ghost hidden" id="nav-logout" onclick="QQAuth.logout()" data-i18n="logout">ออกจากระบบ</button>
    <button id="cart-btn" onclick="openCart()">🛒 <span data-i18n="cart">ตะกร้า</span> (<span id="cart-count">0</span>)</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<!-- Cart Panel -->
<div class="overlay" id="cart-overlay">
  <div class="panel">
    <button class="btn-close" onclick="closePanel('cart-overlay')">×</button>
    <h2 data-i18n="cart_title">ตะกร้าสินค้า</h2>
    <div id="cart-list"></div>
    <div class="cart-total">
      <span data-i18n="total">รวมทั้งหมด</span>
      <span id="cart-total-amount">฿0</span>
    </div>
    <button class="btn-primary" onclick="openCheckout()" data-i18n="checkout">ชำระเงิน</button>
  </div>
</div>

<!-- Checkout / QR Panel -->
<div class="overlay" id="checkout-overlay">
  <div class="panel">
    <button class="btn-close" onclick="closePanel('checkout-overlay')">×</button>
    <h2 data-i18n="pay_title">สแกนจ่ายผ่าน PromptPay</h2>
    <div id="qr-canvas"></div>
    <div class="qr-info">
      <div id="qr-amount"></div>
      <div>QQSHOP</div>
      <div data-i18n="pay_hint">เปิดแอปธนาคาร แล้วสแกน QR นี้เพื่อชำระเงิน</div>
    </div>
    <button class="btn-primary" onclick="clearCartAfterOrder()" data-i18n="paid_done">โอนเงินเรียบร้อยแล้ว</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="i18n.js"></script>
<script type="module" src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
