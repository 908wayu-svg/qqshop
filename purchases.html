<script>
/* โหมดมืดตามเครื่องของผู้ใช้ — ต้องรันก่อนหน้าเว็บวาด ไม่งั้นจะเห็นพื้นขาวแวบหนึ่งก่อน
   (ไฟล์สคริปต์อื่นอยู่ท้ายหน้า จึงสายเกินไปสำหรับงานนี้) */
try {
  if (matchMedia("(prefers-color-scheme:dark)").matches) {
    document.documentElement.dataset.theme = "dark";
  }
} catch (e) { /* เบราว์เซอร์เก่าที่ไม่รู้จัก matchMedia ก็ใช้โหมดสว่างตามเดิม */ }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">QQSHOP <small data-i18n="purchases">ประวัติการซื้อ</small></a>
  <div class="header-actions">
    <button class="btn-lang" onclick="toggleLang()"><span data-lang-label>EN</span></button>
    <a class="credit-chip" href="wallet.html">
      <span class="credit-label" data-i18n="credit">เครดิต</span>
      <b id="nav-credit-amount">฿0</b>
    </a>
    <a class="btn-ghost" href="index.html" data-i18n="back_to_shop">กลับหน้าร้าน</a>
    <button class="btn-ghost" id="nav-logout" data-i18n="logout">ออกจากระบบ</button>
  </div>
</header>

<div id="gate" class="gate"><span data-i18n="loading">กำลังโหลด...</span></div>

<main id="page" class="wallet-main hidden">

  <section class="tiles">
    <div class="tile">
      <div class="tile-label" data-i18n="total_spent">ยอดซื้อสะสม</div>
      <div class="tile-value" id="kpi-spent">—</div>
    </div>
    <div class="tile">
      <div class="tile-label" data-i18n="purchase_count">จำนวนครั้งที่ซื้อ</div>
      <div class="tile-value" id="kpi-count">—</div>
    </div>
  </section>

  <div class="toolbar">
    <h2 data-i18n="my_purchases">ประวัติการซื้อของฉัน</h2>
    <div class="range-filter" id="status-filter">
      <button class="range-btn active" data-st="all" data-i18n="all">ทั้งหมด</button>
      <button class="range-btn" data-st="completed" data-i18n="st_completed">สำเร็จ</button>
      <button class="range-btn" data-st="pending" data-i18n="st_pending">รอดำเนินการ</button>
      <button class="range-btn" data-st="cancelled" data-i18n="st_cancelled">ยกเลิกแล้ว</button>
    </div>
  </div>

  <p class="hint hidden" id="history-note"></p>
  <div id="list"></div>
</main>

<!-- แก้ไขข้อมูลไอดีเกม (ได้เฉพาะออเดอร์ที่ยัง "รอดำเนินการ") -->
<div class="overlay" id="edit-overlay">
  <div class="panel">
    <button class="btn-close" onclick="closePanel('edit-overlay')" data-i18n-title="close" title="ปิด">×</button>
    <h2 data-i18n="edit_info">แก้ไขข้อมูลไอดีเกม</h2>
    <div class="hint" data-i18n="edit_info_hint">แก้ได้เฉพาะตอนสถานะ “รอดำเนินการ” เท่านั้น</div>
    <div id="edit-list"></div>
    <div class="hint warn-note" data-i18n="edit_info_warn">ถ้าแก้ช้าจนแอดมินเติมเข้าไอดีเดิมไปแล้ว ร้านไม่รับผิดชอบ</div>
    <div id="edit-msg" class="msg"></div>
    <button class="btn-primary" id="edit-save" data-i18n="save">บันทึก</button>
  </div>
</div>

<!-- ไอดี/รหัสผ่านที่ซื้อมา -->
<div class="overlay" id="cred-overlay">
  <div class="panel">
    <button class="btn-close" onclick="closePanel('cred-overlay')">×</button>
    <h2 id="cred-title"></h2>
    <div id="cred-list"></div>
    <div class="hint" data-i18n="keep_safe">เก็บข้อมูลนี้ไว้ให้ดี และรีบเปลี่ยนรหัสผ่านหลังได้รับ</div>
  </div>
</div>

<script src="i18n.js"></script>
